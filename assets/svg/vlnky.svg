<svg width="300" height="100" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Wave bars with animation -->
  <rect x="40" y="45" width="8" height="10" rx="4" fill="url(#waveGradient)" class="wave-bar">
    <animate attributeName="height" values="10;30;10" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="y" values="45;35;45" dur="1.2s" repeatCount="indefinite" />
  </rect>

  <rect x="70" y="35" width="8" height="30" rx="4" fill="url(#waveGradient)" class="wave-bar">
    <animate attributeName="height" values="30;50;30" dur="1.2s" begin="0.1s" repeatCount="indefinite" />
    <animate attributeName="y" values="35;25;35" dur="1.2s" begin="0.1s" repeatCount="indefinite" />
  </rect>

  <rect x="100" y="20" width="8" height="60" rx="4" fill="url(#waveGradient)" class="wave-bar">
    <animate attributeName="height" values="60;70;60" dur="1.2s" begin="0.2s" repeatCount="indefinite" />
    <animate attributeName="y" values="20;15;20" dur="1.2s" begin="0.2s" repeatCount="indefinite" />
  </rect>

  <rect x="130" y="25" width="8" height="50" rx="4" fill="url(#waveGradient)" class="wave-bar">
    <animate attributeName="height" values="50;65;50" dur="1.2s" begin="0.3s" repeatCount="indefinite" />
    <animate attributeName="y" values="25;17;25" dur="1.2s" begin="0.3s" repeatCount="indefinite" />
  </rect>

  <rect x="160" y="30" width="8" height="40" rx="4" fill="url(#waveGradient)" class="wave-bar">
    <animate attributeName="height" values="40;55;40" dur="1.2s" begin="0.4s" repeatCount="indefinite" />
    <animate attributeName="y" values="30;22;30" dur="1.2s" begin="0.4s" repeatCount="indefinite" />
  </rect>

  <rect x="190" y="35" width="8" height="30" rx="4" fill="url(#waveGradient)" class="wave-bar">
    <animate attributeName="height" values="30;50;30" dur="1.2s" begin="0.5s" repeatCount="indefinite" />
    <animate attributeName="y" values="35;25;35" dur="1.2s" begin="0.5s" repeatCount="indefinite" />
  </rect>

  <rect x="220" y="40" width="8" height="20" rx="4" fill="url(#waveGradient)" class="wave-bar">
    <animate attributeName="height" values="20;35;20" dur="1.2s" begin="0.6s" repeatCount="indefinite" />
    <animate attributeName="y" values="40;32;40" dur="1.2s" begin="0.6s" repeatCount="indefinite" />
  </rect>

  <style>
    .wave-bar {
      filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.6));
    }
  </style>
</svg>
